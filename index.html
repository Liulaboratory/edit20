<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{--cream:#F8F3E7;--cream2:#EFE7D4;--ink:#2B2A26;--soft:#5B5850;--faint:#8A867C;
--maroon:#7A2E2E;--gold:#C9A24B;--rail:#D8CFBB;--ok:#3F6B48;--warn:#A05A00;
--serif:'Noto Serif SC','Songti SC',serif;--latin:'Cormorant Garamond',Georgia,serif;
--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:14px;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:2px solid var(--maroon);
padding:.6rem clamp(.8rem,3vw,2rem);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-family:var(--serif);font-weight:900;font-size:1.15rem;letter-spacing:.2em;color:var(--maroon)}
header .sub{font-family:var(--latin);color:var(--faint);font-size:.85rem;letter-spacing:.1em}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--soft)}
.who select{font:inherit;padding:.2em .5em;border:1px solid var(--rail);border-radius:4px;background:#fff}
#sync{font-size:.78rem;padding:.25em .7em;border-radius:99px;border:1px solid var(--rail);color:var(--soft);white-space:nowrap}
#sync.on{border-color:var(--ok);color:var(--ok)}
#sync.off{border-color:var(--warn);color:var(--warn)}
nav{display:flex;gap:.3rem;padding:.5rem clamp(.8rem,3vw,2rem) 0;flex-wrap:wrap;background:var(--cream);
position:sticky;top:52px;z-index:19;border-bottom:1px solid var(--rail)}
nav button{font:inherit;font-size:.9rem;padding:.4em 1em;border:1px solid var(--rail);border-bottom:none;
background:var(--cream2);color:var(--soft);border-radius:6px 6px 0 0;cursor:pointer}
nav button.on{background:#fff;color:var(--maroon);font-weight:500;border-color:var(--maroon)}
main{padding:1rem clamp(.8rem,3vw,2rem) 4rem;max-width:1100px;margin:0 auto}
.tabpane{display:none}.tabpane.on{display:block}
.subtabs{display:flex;gap:.4rem;margin:.4rem 0 .8rem;flex-wrap:wrap;align-items:center}
.subtabs button{font:inherit;font-size:.85rem;padding:.3em .9em;border:1px solid var(--rail);border-radius:99px;background:#fff;cursor:pointer;color:var(--soft)}
.subtabs button.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.chip{font-size:.8rem;color:var(--faint)}
.filters{margin-left:auto;display:flex;gap:.3rem}
.row{display:flex;gap:.7rem;padding:.55rem .6rem;border-bottom:1px solid var(--cream2);align-items:flex-start;background:#fff}
.row:nth-child(even){background:#FDFBF4}
.row.dim{opacity:.45}
.row.off{display:none}
.row input[type=checkbox]{width:1.1rem;height:1.1rem;margin-top:.25rem;accent-color:var(--maroon);flex:0 0 auto}
.pi{flex:1;min-width:0}
.pi .t{font-weight:500}
.pi .t a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--gold)}
.pi .m{font-size:.8rem;color:var(--soft)}
.pi .m i{font-style:italic}
.pi .no{font-family:var(--latin);font-weight:600;color:var(--maroon)}
.star{color:var(--gold);letter-spacing:.05em}
.ul{font-size:.72rem;color:var(--warn)}
.ctl{display:flex;flex-direction:column;gap:.3rem;flex:0 0 200px;max-width:40vw}
.ctl input[type=text]{font:inherit;font-size:.8rem;padding:.25em .5em;border:1px solid var(--rail);border-radius:4px;background:var(--cream);width:100%}
.ctl input[type=text]:focus{outline:1.5px solid var(--gold);background:#fff}
.mini{font-size:.7rem;color:var(--faint);cursor:pointer;border:none;background:none;text-align:left;padding:0;text-decoration:underline dotted}
.ghead{font-family:var(--serif);font-weight:700;color:var(--maroon);letter-spacing:.15em;margin:1.1rem 0 .3rem;border-bottom:1px solid var(--maroon);padding-bottom:.2rem;display:flex;gap:.6rem;align-items:baseline}
.badge{font-size:.72rem;border:1px solid var(--rail);border-radius:3px;padding:0 .4em;color:var(--soft)}
.badge.p{border-color:var(--gold);color:var(--warn)}
.verd{display:flex;gap:.3rem;flex:0 0 auto;align-items:center}
.verd button{font:inherit;font-size:.78rem;padding:.25em .7em;border:1px solid var(--rail);border-radius:4px;background:#fff;cursor:pointer}
.verd button.y.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.verd button.n.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.by{font-size:.7rem;color:var(--faint)}
.mrow{background:#fff;border-bottom:1px solid var(--cream2);padding:.5rem .6rem;display:flex;gap:.7rem}
.mrow .y{font-family:var(--latin);font-weight:600;color:var(--maroon);flex:0 0 4.2rem}
.mrow textarea{flex:1;font:inherit;font-size:.85rem;border:1px solid transparent;background:transparent;resize:vertical;min-height:2.2em;line-height:1.5;padding:.2em .4em}
.mrow textarea:focus{outline:none;border-color:var(--gold);background:var(--cream);border-radius:4px}
.note{font-size:.82rem;color:var(--soft);background:var(--cream2);border-left:3px solid var(--gold);padding:.6rem .9rem;margin:.6rem 0;border-radius:0 6px 6px 0}
.msgbox{display:flex;gap:.5rem;margin:.6rem 0}
.msgbox textarea{flex:1;font:inherit;padding:.4em .6em;border:1px solid var(--rail);border-radius:6px;min-height:3em;background:#fff}
.msgbox button,.exbtn{font:inherit;padding:.4em 1.1em;border:none;border-radius:6px;background:var(--maroon);color:#fff;cursor:pointer;align-self:flex-end}
.msg{background:#fff;border-bottom:1px solid var(--cream2);padding:.5rem .7rem}
.msg .by2{font-size:.75rem;color:var(--maroon);font-weight:500}
.exbtn{background:var(--ok);margin:.3rem .4rem .3rem 0}
h3.sec{font-family:var(--serif);letter-spacing:.2em;color:var(--maroon);margin:.2rem 0 .5rem}
.help p{margin:.4rem 0;font-size:.88rem;color:var(--soft)}
footer{padding:1rem;text-align:center;font-size:.72rem;color:var(--faint);letter-spacing:.15em}
@media(max-width:640px){.row{flex-wrap:wrap}.ctl{flex:1 1 100%;max-width:none}}
</style>

  let rows=DATA.papers[curB].slice();
  DATA.excluded.filter(e=>e.g===curB&&(S.corr[e.i]||{}).v==="yes").forEach(e=>rows.push(Object.assign({rescued:true,star:0,ul:false,sel0:false,img0:"",ref:""},e)));
  rows.sort((a,b)=>a.i-b.i);
  rows.forEach(bp=>{
    const st=pState(bp.i,bp), demoted=(S.corr[bp.i]||{}).v==="no";
    if(curF==="sel"&&!st.sel||curF==="un"&&st.sel)return;
    const r=$("div","row"+(demoted?" dim":""));
    const cb=$("input");cb.type="checkbox";cb.checked=st.sel&&!demoted;cb.disabled=demoted;
    cb.onchange=()=>persist("papers",bp.i,stamp({sel:cb.checked,img:ii.value.trim(),note:ni.value.trim()}));
    const pi=$("div","pi");
    const t=$("div","t");t.appendChild($("span","no","["+bp.i+"] "));
    if(bp.doi){const a=$("a","",bp.t);a.href="https://doi.org/"+bp.doi;a.target="_blank";a.rel="noopener";t.appendChild(a);}else t.appendChild($("span","",bp.t));
    if(bp.star)t.appendChild($("span","star"," "+"★".repeat(bp.star)));
    if(bp.rescued)t.appendChild($("span","ul"," （裁定捞回）"));
    const m=$("div","m");m.innerHTML="";m.appendChild($("span","",bp.y+" · "));
    const ji=$("i","",bp.j);m.appendChild(ji);m.appendChild($("span",""," "+(bp.ref||"")));
    pi.appendChild(t);pi.appendChild(m);
    const au=$("div","m",bp.au&&bp.au.length>110?bp.au.slice(0,110)+"…":bp.au||"");pi.appendChild(au);
    if(bp.ul&&!demoted){const w=$("div","ul","⚠ 无✳标记·末位作者·推定通讯　");
      const jb=$("button","mini","标为非通讯");jb.onclick=()=>persist("corr",bp.i,stamp({v:"no"}));
      w.appendChild(jb);pi.appendChild(w);}
    if(demoted)pi.appendChild($("div","ul","已被标为非通讯（在\"通讯裁定\"页可改回）"));
    const ctl=$("div","ctl");
    const ii=$("input");ii.type="text";ii.placeholder="小图文件名（如 "+bp.i+".png）";ii.value=st.img;
    const ni=$("input");ni.type="text";ni.placeholder="备注";ni.value=st.note;
    let dT=null;const save=()=>persist("papers",bp.i,stamp({sel:cb.checked,img:ii.value.trim(),note:ni.value.trim()}));
    [ii,ni].forEach(x=>x.oninput=()=>{clearTimeout(dT);dT=setTimeout(save,900);});
    ctl.appendChild(ii);ctl.appendChild(ni);
    r.appendChild(cb);r.appendChild(pi);r.appendChild(ctl);plist.appendChild(r);
  });
  refreshCounts();
}
function refreshCounts(){
  let n=0,tot=DATA.papers[curB].length;
  DATA.papers[curB].forEach(bp=>{if(pState(bp.i,bp).sel&&(S.corr[bp.i]||{}).v!=="no")n++;});
  cnt.textContent="已选 "+n+" / 共 "+tot+" 篇（建议约25）";
}

/* ---------- people ---------- */
const PE=panes.people;
PE.appendChild($("div","note","勾选 = 收入\"Liu Group People\"；版式为「刘组官网老照片 → 本人现课题组合照」，建组合照向本人征集后把文件名填进来。✦ = 教授/PI。"));
const pplist=$("div");PE.appendChild(pplist);
function renderPeople(){
  pplist.textContent="";let g="";
  DATA.people.forEach(pp=>{
    if(pp.g!==g){g=pp.g;const h=$("div","ghead");h.appendChild($("span","",g+" 组"));
      h.appendChild($("span","chip",{A:"2007–2010入组",B:"2011–2014",C:"2015–2018",D:"2019后/年份不详"}[g]));pplist.appendChild(h);}
    const o=S.people[pp.s]||{};const sel=o.sel!==undefined?o.sel:pp.prof;
    const r=$("div","row");
    const cb=$("input");cb.type="checkbox";cb.checked=sel;
    const pi=$("div","pi");
    const t=$("div","t");t.appendChild($("span","",pp.n+" "));
    if(pp.prof)t.appendChild($("span","badge p","✦ 教授/PI"));
    pi.appendChild(t);
    pi.appendChild($("div","m",[pp.role,pp.per].filter(Boolean).join(" · ")));
    pi.appendChild($("div","m",pp.dest||"（去向待补）"));
    const ctl=$("div","ctl");
    const gi=$("input");gi.type="text";gi.placeholder="建组合照文件名";gi.value=o.photo||"";
    const ni=$("input");ni.type="text";ni.placeholder="备注/纠错";ni.value=o.note||"";
    let dT=null;const save=()=>persist("people",pp.s,stamp({sel:cb.checked,photo:gi.value.trim(),note:ni.value.trim()}));
    cb.onchange=save;[gi,ni].forEach(x=>x.oninput=()=>{clearTimeout(dT);dT=setTimeout(save,900);});
    ctl.appendChild(gi);ctl.appendChild(ni);
    r.appendChild(cb);r.appendChild(pi);r.appendChild(ctl);pplist.appendChild(r);
  });
}

/* ---------- corr adjudication ---------- */
const C=panes.corr;
C.appendChild($("div","note","这 "+DATA.excluded.length+" 篇因官网未标✳或刘老师无✳被暂时剔除。请（尤其请刘老师）裁定：「是通讯」会自动回到对应组的选图列表；不确定就留着。"));
const clist=$("div");C.appendChild(clist);
function renderCorr(){
  clist.textContent="";let g="";
  DATA.excluded.forEach(e=>{
    if(e.g!==g){g=e.g;clist.appendChild($("div","ghead",g+" 段"));}
    const v=(S.corr[e.i]||{}).v, by=(S.corr[e.i]||{}).by;
    const r=$("div","row");
    const pi=$("div","pi");
    const t=$("div","t");t.appendChild($("span","no","["+e.i+"] "));
    if(e.doi){const a=$("a","",e.t);a.href="https://doi.org/"+e.doi;a.target="_blank";a.rel="noopener";t.appendChild(a);}else t.appendChild($("span","",e.t));
    pi.appendChild(t);
    pi.appendChild($("div","m",e.y+" · "+e.j));
    pi.appendChild($("div","m",e.au&&e.au.length>110?e.au.slice(0,110)+"…":e.au||""));
    pi.appendChild($("div","ul",e.why));
    const vd=$("div","verd");
    const yb=$("button","y"+(v==="yes"?" on":""),"是通讯");
    const nb=$("button","n"+(v==="no"?" on":""),"非通讯");
    yb.onclick=()=>{persist("corr",e.i,stamp({v:v==="yes"?"":"yes"}));renderCorr();renderPapers();};
    nb.onclick=()=>{persist("corr",e.i,stamp({v:v==="no"?"":"no"}));renderCorr();renderPapers();};
    vd.appendChild(yb);vd.appendChild(nb);
    if(v)vd.appendChild($("span","by",by||""));
    r.appendChild(pi);r.appendChild(vd);clist.appendChild(r);
  });
}

/* ---------- milestones ---------- */
const M=panes.miles;
M.appendChild($("div","note","「二十年二十事」正文，直接改字即存（尤其欢迎刘老师补正史实）。"));
const mlist=$("div");M.appendChild(mlist);
function renderMiles(){
  mlist.textContent="";
  DATA.miles.forEach(mm=>{
    const o=S.miles[mm.y]||{};
    const r=$("div","mrow");r.appendChild($("div","y",mm.y));
    const ta=$("textarea");ta.value=o.text!==undefined?o.text:mm.t;
    let dT=null;ta.oninput=()=>{clearTimeout(dT);dT=setTimeout(()=>persist("miles",mm.y,stamp({text:ta.value})),900);};
    r.appendChild(ta);
    if(o.by)r.appendChild($("span","by","改:"+o.by));
    mlist.appendChild(r);
  });
}

/* ---------- messages ---------- */
const G=panes.msg;
G.appendChild($("div","note","版式意见、纠错、想加的内容都写这里。"));
const box=$("div","msgbox");const ta=$("textarea");ta.placeholder="留言…";
const sb=$("button","","发送");box.appendChild(ta);box.appendChild(sb);G.appendChild(box);
const mlog=$("div");G.appendChild(mlog);
let msgs=[];
sb.onclick=()=>{const txt=ta.value.trim();if(!txt)return;
  const doc=Object.assign(stamp({text:txt}),{id:Date.now()+"-"+Math.random().toString(36).slice(2,7)});ta.value="";
  if(db)db.collection("msg").add(doc).catch(()=>{});
  else{msgs.unshift(doc);renderMsgs();lsSave();ghSchedule();}
};
function renderMsgs(){
  mlog.textContent="";
  msgs.slice(0,100).forEach(m=>{const d=$("div","msg");
    d.appendChild($("div","by2",(m.by||"匿名")+" · "+(m.t||"")));
    d.appendChild($("div","",m.text||""));mlog.appendChild(d);});
}

/* ---------- help + export ---------- */
const H=panes.help;
H.appendChild($("h3","sec","使用说明"));
const help=$("div","help");
[ "① 右上角先选「你是谁」，改动会记名。",
  "② 论文选图：A/B/C/D 各组在自己的表里勾选（每组约25篇），小图按「编号.png」命名发给宋佳，或在文件名框写清楚。",
  "③ 人物志：勾选收录的人（默认预勾教授/PI），建组合照征集到后填文件名。",
  "④ 通讯裁定：请刘老师有空扫一眼，点「是通讯 / 非通讯」即可，判为通讯的自动回到选图列表。",
  "⑤ 顶部显示「实时同步」时，所有人看到的是同一份，改动即时合并；显示「本地模式」时改动只存在本机——请点下方按钮导出结果发给宋佳。",
].forEach(s=>help.appendChild($("p","",s)));
H.appendChild(help);
H.appendChild($("h3","sec","同步设置"));
const sy=$("div","help");
sy.appendChild($("p","","粘贴群里发的「同步码」并保存，全组的勾选/修改即互通（每分钟自动拉取，改动后几秒自动上传）。没有同步码也能用：改动存在本机，请用下方按钮导出发给宋佳。"));
const ti=document.createElement("input");ti.type="password";ti.placeholder="同步码";
ti.style.cssText="font:inherit;padding:.35em .6em;border:1px solid var(--rail);border-radius:6px;width:min(22rem,75%);background:#fff";
const tb=$("button","exbtn","保存并连接");tb.style.marginLeft=".5rem";
sy.appendChild(ti);sy.appendChild(tb);H.appendChild(sy);
const ex=$("button","exbtn","导出我的勾选结果(JSON)");
ex.onclick=async()=>{
  const payload=JSON.stringify({who:WHO,when:new Date().toISOString(),state:S},null,1);
  const fn="LiuLab20_"+(WHO||"anon")+".json";
  let dl=null;try{dl=window.claude&&await window.claude.use("downloads");}catch(e){}
  if(dl){try{await dl.save({filename:fn,data:payload});}catch(e){}return;}
  const blob=new Blob([payload],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
H.appendChild(ex);
const im=$("button","exbtn","导入JSON合并");im.style.background="#5B5850";
const fi=document.createElement("input");fi.type="file";fi.accept=".json";fi.style.display="none";
im.onclick=()=>fi.click();
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result).state||{};
    for(const k in S)for(const id in (j[k]||{})){S[k][id]=j[k][id];if(db)db.collection(k).doc(String(id)).set(j[k][id]).catch(()=>{});}
    lsSave();renderAll();}catch(e){alert("文件无法解析")}};
  rd.readAsText(f);};
H.appendChild(im);H.appendChild(fi);

function renderAll(){renderPapers();renderPeople();renderCorr();renderMiles();renderMsgs();}

/* ---------- github sync ---------- */
const GH={repo:"Liulaboratory/lg20-data",path:"state.json",branch:"main"};
let ghTok="",ghSha=null,ghT=null,ghBusy=false,ghTimer=null;
try{ghTok=localStorage.getItem("lg20-ghtok")||""}catch(e){}
function b64e(str){const b=new TextEncoder().encode(str);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x);}
function b64d(str){const x=atob((str||"").replace(/\s/g,""));const a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return new TextDecoder().decode(a);}
function mergeState(remote){
  let changed=false;
  ["papers","people","corr","miles"].forEach(col=>{const rc=remote[col]||{};
    for(const id in rc){const r=rc[id],l=S[col][id];
      if(!l||String(r.t||"")>String(l.t||"")){S[col][id]=r;changed=true;}}});
  const seen=new Set(msgs.map(m=>m.id));
  (remote.msg||[]).forEach(m=>{if(m&&m.id&&!seen.has(m.id)){msgs.push(m);changed=true;}});
  msgs.sort((a,b)=>String(b.t||"").localeCompare(String(a.t||"")));
  if(msgs.length>200)msgs=msgs.slice(0,200);
  return changed;
}
function exportState(){return JSON.stringify({papers:S.papers,people:S.people,corr:S.corr,miles:S.miles,msg:msgs.slice(0,200)});}
async function ghGet(){
  const r=await fetch("https://api.github.com/repos/"+GH.repo+"/contents/"+GH.path+"?ref="+GH.branch+"&ts="+Date.now(),
    {headers:{Authorization:"Bearer "+ghTok,Accept:"application/vnd.github+json"}});
  if(r.status===404){ghSha=null;return{};}
  if(r.status===401)throw new Error("码无效401");if(r.status===403)throw new Error("被拒403");if(!r.ok)throw new Error("读取"+r.status);
  const j=await r.json();ghSha=j.sha;
  try{return JSON.parse(b64d(j.content))||{}}catch(e){return{}}
}
async function ghPut(){
  const body={message:"sync "+(WHO||"anon"),content:b64e(exportState()),branch:GH.branch};
  if(ghSha)body.sha=ghSha;
  const r=await fetch("https://api.github.com/repos/"+GH.repo+"/contents/"+GH.path,
    {method:"PUT",headers:{Authorization:"Bearer "+ghTok,Accept:"application/vnd.github+json"},body:JSON.stringify(body)});
  if(r.ok){const j=await r.json();if(j.content&&j.content.sha)ghSha=j.content.sha;return true;}
  return r.status;
}
async function ghSync(push){
  if(!ghTok||ghBusy||db)return;ghBusy=true;
  try{
    if(mergeState(await ghGet())){lsSave();renderAll();}
    if(push){
      let ok=await ghPut();
      if(ok!==true){ if(mergeState(await ghGet())){lsSave();renderAll();} ok=await ghPut(); }
    }
    syncEl.textContent="● GitHub同步";syncEl.className="on";
  }catch(e){syncEl.textContent="○ 同步失败："+(e&&e.message||"网络");syncEl.className="off";}
  ghBusy=false;
}
function ghSchedule(){if(!ghTok||db)return;clearTimeout(ghT);ghT=setTimeout(()=>ghSync(true),2500);}
function ghStart(){
  if(!ghTok||db)return;
  ghSync(true);
  clearInterval(ghTimer);ghTimer=setInterval(()=>ghSync(false),60000);
}
ti.value=ghTok;
tb.onclick=()=>{ghTok=ti.value.replace(/\s+/g,"");ti.value=ghTok;try{localStorage.setItem("lg20-ghtok",ghTok)}catch(e){}
  if(ghTok)ghStart();else{clearInterval(ghTimer);syncEl.textContent="○ 本地模式";syncEl.className="off";}};

/* ---------- boot ---------- */
lsLoad();renderAll();
syncEl.textContent="○ 本地模式";syncEl.className="off";
(async()=>{
  try{db=window.claude&&await window.claude.use("db");}catch(e){db=null;}
  if(!db){ghStart();return;}
  syncEl.textContent="● 实时同步";syncEl.className="on";
  const bind=(col,apply)=>db.collection(col).onSnapshot(snap=>{
    snap.docs.forEach(d=>{if(d.exists)S[col][d.id]=d.data();});
    lsSave();apply();
  },()=>{syncEl.textContent="○ 同步中断";syncEl.className="off";});
  bind("papers",()=>{renderPapers();});
  bind("people",()=>{renderPeople();});
  bind("corr",()=>{renderCorr();renderPapers();});
  bind("miles",()=>{renderMiles();});
  db.collection("msg").orderBy("t","desc").limit(100).onSnapshot(snap=>{
    msgs=snap.docs.map(d=>d.data());renderMsgs();
  },()=>{});
})();
</script>
